name: EAS Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS Build Profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
          - development
  push:
    branches:
      - main
      - preview
    paths:
      - "apps/mobile-user/**"
      - "apps/mobile-driver/**"

env:
  # Customize these image names if needed
  USER_IMAGE_NAME: taxyciti-user
  DRIVER_IMAGE_NAME: taxyciti-driver
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  KV_URL: ${{ secrets.KV_URL }}
  KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
  KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
  KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mobile-user, mobile-driver]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build ${{ matrix.app }}
        working-directory: ./apps/${{ matrix.app }}
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
