name: Build and Publish API Container

on:
 push:
  branches:
   - main
  paths:
   - "apps/api/**"
   - "packages/**"
   - "pnpm-lock.yaml"
   - "turbo.json"
   - ".github/workflows/api-docker-publish.yml"
 workflow_dispatch:

env:
 REGISTRY: docker.io
 IMAGE_NAME: mmpotulo28/taxiciti-api # Based on your docker build command

jobs:
 build-and-push:
  runs-on: ubuntu-latest
  permissions:
   contents: read

  steps:
   - name: Checkout repository
     uses: actions/checkout@v4

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3

   - name: Log in to the Container registry
     uses: docker/login-action@v3
     with:
      registry: ${{ env.REGISTRY }} # This will be docker.io
      username: mmpotulo28 # Your Docker Hub username
      password: ${{ secrets.DOCKER_HUB_TOKEN }} # Use a dedicated Docker Hub token

   - name: Extract metadata (tags, labels) for Docker
     id: meta
     uses: docker/metadata-action@v5
     with:
      images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      tags: |
       type=ref,event=branch
       type=sha,format=short
       type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

   - name: Build and push Docker image
     uses: docker/build-push-action@v5
     with:
      context: .
      file: apps/api/Dockerfile
      push: true
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.steps.meta.outputs.labels }}
      cache-from: type=gha
      cache-to: type=gha,mode=max
